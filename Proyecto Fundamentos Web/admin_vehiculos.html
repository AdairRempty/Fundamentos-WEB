<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack | Parque Vehicular</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/admin_style.css">
</head>
<body>
    <div class="dashboard-grid">
        <ecotrack-sidebar role="admin" active-page="vehiculos"></ecotrack-sidebar>
        <main>
            <ecotrack-topbar title="Parque Vehicular y Choferes"></ecotrack-topbar>
            <div class="main-content">
                <div class="dashboard-card animate-up">
                    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.25rem;">
                        <div style="width:36px;height:36px;border-radius:10px;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;">
                            <i class="ph ph-truck" style="color:#fff;font-size:1.1rem;"></i>
                        </div>
                        <div>
                            <h3 style="margin:0;">Registrar Nuevo Vehículo</h3>
                            <p style="margin:0;color:var(--text-light);font-size:0.82rem;">Unidades habilitadas para transporte de residuos.</p>
                        </div>
                    </div>
                    <hr style="border:none;border-top:1px solid var(--border-color);margin:1rem 0 1.25rem;">
                    <form id="vehiculoForm" class="form-grid">
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-license-plate"></i> Placas <span style="color:#d32f2f">*</span></label>
                            <input type="text" id="veh_placas" class="form-control" placeholder="Ej. ABC-1234" required>
                        </div>
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-steering-wheel"></i> Chofer / Operador</label>
                            <input type="text" id="veh_chofer" class="form-control" placeholder="Nombre del responsable (opcional)">
                        </div>
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-truck"></i> Marca / Modelo <span style="color:#d32f2f">*</span></label>
                            <input type="text" id="veh_modelo" class="form-control" placeholder="Ej. Ford F-350 2022" required>
                        </div>
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-scales"></i> Capacidad de Carga (Kg) <span style="color:#d32f2f">*</span></label>
                            <input type="number" step="0.01" id="veh_cap" class="form-control" placeholder="Ej. 5000" required>
                        </div>
                        <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end;">
                            <button type="submit" class="btn btn-primary"><i class="ph ph-plus-circle"></i> Añadir Vehículo</button>
                        </div>
                    </form>
                </div>
                <div class="dashboard-card animate-up" style="animation-delay: 0.1s;">
                    <h3>Catálogo Vehicular Activo</h3>
                    <div style="margin-bottom: 1rem; display: flex; justify-content: flex-end;"><input type="text" class="table-search form-control" data-target="vehiculosTableBody" placeholder="Buscar vehículo..." style="max-width: 300px;"></div>
                    <div class="table-responsive">
                        <table class="data-table" style="margin-top: 0;">
                            <thead><tr><th>ID</th><th>Placas</th><th>Marca/Modelo</th><th>Capacidad (Kg)</th><th>Chofer Asignado</th><th>Acciones</th></tr></thead>
                            <tbody id="vehiculosTableBody">
                                <tr><td colspan="5" style="text-align: center;">Cargando vehículos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Modal Editar Vehiculo -->
    <div class="modal-overlay" id="editVehiculoModal">
        <div class="modal-box" style="max-width: 500px;">
            <div class="modal-header">
                <div>
                    <h2><i class="ph ph-truck"></i> Editar Vehículo</h2>
                </div>
                <button class="modal-close" onclick="cerrarEditVehiculoModal()">✕</button>
            </div>
            <form id="editVehiculoForm">
                <div class="modal-body form-grid" style="padding: 1.5rem;">
                    <input type="hidden" id="edit_veh_id">
                    <div style="grid-column: 1 / -1;"><label>Placas</label><input type="text" id="edit_veh_placas" class="form-control" required></div>
                    <div style="grid-column: 1 / -1;"><label>Chofer</label><input type="text" id="edit_veh_chofer" class="form-control" required></div>
                    <div style="grid-column: 1 / -1;"><label>Modelo</label><input type="text" id="edit_veh_modelo" class="form-control" required></div>
                    <div style="grid-column: 1 / -1;"><label>Capacidad (Kg)</label><input type="number" step="0.01" id="edit_veh_cap" class="form-control" required></div>
                </div>
                <div class="modal-footer" style="justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" onclick="cerrarEditVehiculoModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/topbar.js"></script>
    <script src="js/atoms/ui.js"></script>
    <script src="js/molecules/tables.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/admin-vehiculos.js"></script>
</body>
</html>
