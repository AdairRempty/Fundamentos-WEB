<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoTrack | Configuración</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin_style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <div class="dashboard-grid">
      <ecotrack-sidebar active-page="perfil"></ecotrack-sidebar>

      <main>
        <ecotrack-topbar title="Configuración de la Cuenta"></ecotrack-topbar>

        <div class="main-content">
          <form id="perfilForm">
            <div class="dashboard-card animate-up">
              <h3 style="margin-bottom: 0.5rem">Tu Información de Acceso</h3>
              <p style="color: var(--text-light); font-size: 0.9rem">
                Credenciales con las que te conectas de forma segura al portal
                ambiental.
              </p>
              <div class="form-grid">
                <div style="grid-column: 1 / -1">
                  <label>Nombre para Mostrar (Usuario)</label>
                  <input
                    type="text"
                    id="pf_nombre"
                    class="form-control"
                    placeholder="Ej. Juan Pérez"
                    required
                  />
                </div>
                <div style="grid-column: 1 / -1">
                  <label>Tu Correo Electrónico (Login)</label>
                  <input
                    type="email"
                    id="pf_email"
                    class="form-control"
                    required
                  />
                </div>
                <div>
                  <label>Nueva Contraseña (Opcional)</label>
                  <input
                    type="password"
                    id="pf_password"
                    class="form-control"
                    placeholder="Solo escribir si deseas cambiarla"
                  />
                </div>
                <div>
                  <label>Confirmar la Nueva Contraseña</label>
                  <input
                    type="password"
                    id="pf_password_conf"
                    class="form-control"
                    placeholder="Repite para confirmar"
                  />
                </div>
              </div>
            </div>

            <div
              id="empresaPanel"
              class="dashboard-card animate-up"
              style="display: none; animation-delay: 0.1s"
            >
              <h3 style="margin-bottom: 0.5rem">
                Configuración Fiscal y Empresa
              </h3>
              <p style="color: var(--text-light); font-size: 0.9rem">
                Esta información se estampa oficialmente de forma vinculante en
                los manifiestos que proceses.
              </p>
              <div class="form-grid">
                <div>
                  <label>Razón Social</label
                  ><input type="text" id="pf_razon" class="form-control" />
                </div>
                <div>
                  <label>Clave RFC / Número Autorización</label
                  ><input type="text" id="pf_rfc" class="form-control" />
                </div>
                <div>
                  <label>Giro / Tipo de Empresa</label
                  ><input type="text" id="pf_giro" class="form-control" />
                </div>
                <div>
                  <label>Ejecutivo Responsable (Contacto)</label
                  ><input type="text" id="pf_contacto" class="form-control" />
                </div>
                <div style="grid-column: 1 / -1">
                  <label>Dirección del Patio de Operaciones</label
                  ><input type="text" id="pf_direccion" class="form-control" />
                </div>
              </div>
            </div>

            <div style="text-align: right">
              <button
                type="submit"
                class="btn btn-primary"
                style="padding: 0.8rem 2rem"
              >
                Guardar Mis Modificaciones
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/topbar.js"></script>
    <script src="js/atoms/ui.js"></script>
    <script src="js/molecules/tables.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/perfil.js"></script>
  </body>
</html>
