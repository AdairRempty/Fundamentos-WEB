<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="flex-center-vh">

    <div class="auth-card glass-panel animate-up">
        <a href="index.html" style="display: inline-block; margin-bottom: 2rem; text-decoration: none;">
            <div class="nav-brand" style="justify-content: center; font-size: 1.5rem; font-weight: bold; color: var(--primary);">
                <i class="ph-fill ph-leaf"></i> EcoTrack
            </div>
        </a>

        <h2 style="margin-bottom: 0.5rem;">Bienvenido de nuevo</h2>
        <p style="margin-bottom: 2rem; color: var(--text-secondary, #555);">Ingresa a tu portal de gestión</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control-glass" placeholder="usuario@empresa.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="form-control-glass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3 flex-center"><i class="ph ph-sign-in"></i> Iniciar Sesión</button>
        </form>

        <p style="margin-top: 2rem; font-size: 0.9rem;">
            ¿No tienes cuenta? <a href="registro.html" style="color: var(--primary); font-weight: 600;">Solicitar registro</a>
        </p>
    </div>

    <script src="js/atoms/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/auth.js"></script>
</body>
</html>
