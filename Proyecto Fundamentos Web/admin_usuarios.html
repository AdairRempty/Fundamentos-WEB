<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack | Gestión de Usuarios</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/admin_style.css">
</head>
<body>
    <div class="dashboard-grid">
        <ecotrack-sidebar role="admin" active-page="usuarios"></ecotrack-sidebar>
        <main>
            <ecotrack-topbar title="Cuentas de Usuarios"></ecotrack-topbar>
            <div class="main-content">
                <div class="dashboard-card animate-up">
                    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.25rem;">
                        <div style="width:36px;height:36px;border-radius:10px;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;">
                            <i class="ph ph-user-plus" style="color:#fff;font-size:1.1rem;"></i>
                        </div>
                        <div>
                            <h3 style="margin:0;">Registrar Nuevo Usuario</h3>
                            <p style="margin:0;color:var(--text-light);font-size:0.82rem;">Cuentas de acceso al sistema EcoTrack.</p>
                        </div>
                    </div>
                    <hr style="border:none;border-top:1px solid var(--border-color);margin:1rem 0 1.25rem;">
                    <form id="usuarioForm" class="form-grid">
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-envelope"></i> Correo Electrónico <span style="color:#d32f2f">*</span></label>
                            <input type="email" id="usu_email" class="form-control" placeholder="usuario@empresa.com" required>
                        </div>
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-lock"></i> Contraseña <span style="color:#d32f2f">*</span></label>
                            <input type="password" id="usu_pass" class="form-control" placeholder="Contraseña inicial" required>
                        </div>
                        <div class="form-field" style="grid-column: 1 / -1;">
                            <label class="form-label"><i class="ph ph-shield-check"></i> Rol del Sistema <span style="color:#d32f2f">*</span></label>
                            <select id="usu_rol" class="form-control" required>
                                <option value="">Seleccionar rol...</option>
                                <option value="1">Administrador</option>
                                <option value="2">Cliente / Empresa Operadora</option>
                                <option value="3">Visitante</option>
                            </select>
                        </div>
                        <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end;">
                            <button type="submit" class="btn btn-primary"><i class="ph ph-plus-circle"></i> Crear Cuenta</button>
                        </div>
                    </form>
                </div>
                <div class="dashboard-card animate-up" style="animation-delay: 0.1s;">
                    <h3>Usuarios Autorizados</h3>
                    <div style="margin-bottom: 1rem; display: flex; justify-content: flex-end;"><input type="text" class="table-search form-control" data-target="usuariosTableBody" placeholder="Buscar usuario..." style="max-width: 300px;"></div>
                    <div class="table-responsive">
                        <table class="data-table" style="margin-top: 0;">
                            <thead><tr><th>ID</th><th>Empresa Relacionada</th><th>Email</th><th>Rol del Sistema</th><th>Acciones</th></tr></thead>
                            <tbody id="usuariosTableBody">
                                <tr><td colspan="4" style="text-align: center;">Cargando usuarios...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Editar Usuario -->
    <div class="modal-overlay" id="editUsuarioModal">
        <div class="modal-box" style="max-width: 500px;">
            <div class="modal-header">
                <div>
                    <h2><i class="ph ph-users"></i> Editar Usuario</h2>
                </div>
                <button class="modal-close" onclick="cerrarEditUsuarioModal()">✕</button>
            </div>
            <form id="editUsuarioForm">
                <div class="modal-body form-grid" style="padding: 1.5rem;">
                    <input type="hidden" id="edit_usu_id">
                    <div style="grid-column: 1 / -1;"><label>Correo Electrónico</label><input type="email" id="edit_usu_email" class="form-control" required></div>
                    <div style="grid-column: 1 / -1;"><label>Nueva Contraseña (Opcional)</label><input type="password" id="edit_usu_pass" class="form-control" placeholder="Dejar en blanco para no cambiar"></div>
                    <div style="grid-column: 1 / -1;">
                        <label>Rol</label>
                        <select id="edit_usu_rol" class="form-control" required>
                            <option value="1">Administrador</option>
                            <option value="2">Cliente / Empresa Operadora</option>
                            <option value="3">Visitante</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer" style="justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" onclick="cerrarEditUsuarioModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/topbar.js"></script>
    <script src="js/atoms/ui.js"></script>
    <script src="js/molecules/tables.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/admin-usuarios.js"></script>
</body>
</html>
