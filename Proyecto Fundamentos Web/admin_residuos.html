<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack | Catálogo de Residuos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/admin_style.css">
</head>
<body>
    <div class="dashboard-grid">
        <ecotrack-sidebar role="admin" active-page="residuos"></ecotrack-sidebar>
        <main>
            <ecotrack-topbar title="Tipos de Residuos"></ecotrack-topbar>
            <div class="main-content">
                <div class="dashboard-card animate-up">
                    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.25rem;">
                        <div style="width:36px;height:36px;border-radius:10px;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;">
                            <i class="ph ph-recycle" style="color:#fff;font-size:1.1rem;"></i>
                        </div>
                        <div>
                            <h3 style="margin:0;">Registrar Nuevo Residuo</h3>
                            <p style="margin:0;color:var(--text-light);font-size:0.82rem;">Materiales gestionados en el catálogo.</p>
                        </div>
                    </div>
                    <hr style="border:none;border-top:1px solid var(--border-color);margin:1rem 0 1.25rem;">
                    <form id="residuoForm" class="form-grid">
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-leaf"></i> Nombre del Material <span style="color:#d32f2f">*</span></label>
                            <input type="text" id="res_nombre" class="form-control" placeholder="Ej. Cartón, PET, Aluminio" required>
                        </div>
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-barcode"></i> Código Interno <span style="color:#d32f2f">*</span></label>
                            <input type="text" id="res_codigo" class="form-control" placeholder="Ej. RES-010" required>
                        </div>
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-currency-dollar"></i> Precio Base por Kg</label>
                            <input type="number" step="0.01" id="res_precio" class="form-control" placeholder="Ej. 3.50 (opcional)">
                        </div>
                        <div class="form-field">
                            <label class="form-label"><i class="ph ph-note-pencil"></i> Descripción Breve</label>
                            <input type="text" id="res_desc" class="form-control" placeholder="Características o notas">
                        </div>
                        <div style="grid-column: 1 / -1; display: flex; justify-content: flex-end;">
                            <button type="submit" class="btn btn-primary"><i class="ph ph-plus-circle"></i> Añadir Residuo</button>
                        </div>
                    </form>
                </div>
                <div class="dashboard-card animate-up" style="animation-delay: 0.1s;">
                    <h3>Catálogo Disponible</h3>
                    <div style="margin-bottom: 1rem; display: flex; justify-content: flex-end;"><input type="text" class="table-search form-control" data-target="residuosTableBody" placeholder="Buscar residuo..." style="max-width: 300px;"></div>
                    <div class="table-responsive">
                        <table class="data-table" style="margin-top: 0;">
                            <thead><tr><th>ID</th><th>Código</th><th>Nombre</th><th>Precio /Kg</th><th>Descripción</th><th>Acciones</th></tr></thead>
                            <tbody id="residuosTableBody">
                                <tr><td colspan="5" style="text-align: center;">Cargando residuos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <!-- Modal Editar Residuo -->
    <div class="modal-overlay" id="editResiduoModal">
        <div class="modal-box" style="max-width: 500px;">
            <div class="modal-header">
                <div>
                    <h2><i class="ph ph-list-dashes"></i> Editar Residuo</h2>
                </div>
                <button class="modal-close" onclick="cerrarEditResiduoModal()">✕</button>
            </div>
            <form id="editResiduoForm">
                <div class="modal-body form-grid" style="padding: 1.5rem;">
                    <input type="hidden" id="edit_res_id">
                    <div style="grid-column: 1 / -1;"><label>Nombre</label><input type="text" id="edit_res_nombre" class="form-control" required></div>
                    <div style="grid-column: 1 / -1;"><label>Código</label><input type="text" id="edit_res_codigo" class="form-control" required></div>
                    <div style="grid-column: 1 / -1;"><label>Precio /Kg</label><input type="number" step="0.01" id="edit_res_precio" class="form-control"></div>
                    <div style="grid-column: 1 / -1;"><label>Descripción</label><input type="text" id="edit_res_desc" class="form-control"></div>
                </div>
                <div class="modal-footer" style="justify-content: flex-end;">
                    <button type="button" class="btn btn-outline" onclick="cerrarEditResiduoModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/topbar.js"></script>
    <script src="js/atoms/ui.js"></script>
    <script src="js/molecules/tables.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/admin-residuos.js"></script>
</body>
</html>
