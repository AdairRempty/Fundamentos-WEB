<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack | Alta de Manifiesto</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

    <div class="form-card glass-panel animate-up">
        <a href="admin_dashboard.html" style="color: var(--text-light); display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
            <i class="ph ph-arrow-left"></i> Volver al panel
        </a>
        
        <h2>Registro de Manifiesto</h2>
        <p>Formato de Entrega, Transporte y Recepción de Residuos de Manejo Especial.</p>

        <form id="manifiestoForm">
            <!-- Sección 1: Generador -->
            <div class="title"><i class="ph-fill ph-factory"></i> 1. Empresa Generadora</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Razón Social Generador</label>
                    <select id="empresa_id" class="form-control" required>
                        <option value="">-- Seleccionar Empresa Generadora --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Fecha de Recolección</label>
                    <input id="fecha" type="date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Folio</label>
                    <input id="folio" type="text" class="form-control" placeholder="Ej: SGM-20400" required>
                </div>
            </div>

            <!-- Sección 2: Transportista -->
            <div class="title"><i class="ph-fill ph-truck"></i> 2. Datos del Transportista</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Vehículo Autorizado</label>
                    <select id="vehiculo_id" class="form-control" required>
                        <option value="">-- Seleccionar Vehículo --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nombre del Operador/Chofer</label>
                    <input id="chofer" type="text" class="form-control" placeholder="Se autocompleta con el vehículo..." readonly>
                </div>
            </div>

            <!-- Sección 3: Residuos -->
            <div class="title"><i class="ph-fill ph-recycle"></i> 3. Declaración de Residuos</div>
            <div class="table-responsive">
                <table class="table-secondary">
                    <thead>
                        <tr>
                            <th class="table-secondary" style="min-width: 150px;">Material</th>
                            <th class="table-secondary" style="min-width: 150px;">Tipo de Envase</th>
                            <th class="table-secondary" style="min-width: 120px;">Peso Bruto (kg)</th>
                            <th class="table-secondary" style="min-width: 120px;">Peso Neto (kg)</th>
                            <th class="table-secondary" style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody id="residuosTableBody">
                        <tr>
                            <td>
                                <select id="residuo_id" class="form-control residuo-select" required>
                                    <option value="">Seleccionar...</option>
                                </select>
                            </td>
                            <td>
                                <select class="form-control" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="Pacas">Pacas</option>
                                    <option value="Tambos">Tambos (200L)</option>
                                    <option value="Granel">A granel</option>
                                </select>
                            </td>
                            <td><input id="peso_bruto" type="number" step="0.01" class="form-control peso-bruto-input" placeholder="0.00"></td>
                            <td><input id="peso_neto" type="number" step="0.01" class="form-control peso-neto-input" placeholder="0.00" required></td>
                            <td style="text-align:center;"><button type="button" class="btn btn-outline" style="color:var(--danger); padding:0.4rem; height:auto; width:auto;" onclick="this.closest('tr').remove()"><i class="ph-bold ph-trash"></i></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button type="button" class="btn btn-outline" style="margin-top: 1rem; padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="agregarResiduo()">+ Agregar otro residuo</button>

            <!-- Sección 4: Recepción -->
            <div class="title"><i class="ph-fill ph-check-circle"></i> 4. Recibido en Centro de Acopio</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Estatus Inicial</label>
                    <select id="estatus" class="form-control" required>
                        <option value="En tránsito">En tránsito (Recolección)</option>
                        <option value="Recibido">Recibido en Planta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Observaciones (Incidencias)</label>
                    <input type="text" id="observaciones" class="form-control" placeholder="Detalles sobre pesos húmedos o diferencias...">
                </div>
            </div>

            <div style="margin-top: 3rem; display: flex; justify-content: flex-end; gap: 1rem;">
                <a href="admin_dashboard.html" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-primary">Guardar Manifiesto y Bitácora</button>
            </div>
        </form>
    </div>

    <script src="js/atoms/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/admin-manifiestos.js"></script>
</body>
</html>
